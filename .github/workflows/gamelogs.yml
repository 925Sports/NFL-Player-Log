name: Weekly player logs
on:
  schedule:
    - cron: "15 15 * * 2,3"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_rosters.py
      - run: python scripts/fetch_gamelogs.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "gamelogs refresh $(date -u +%F)"
          git push
